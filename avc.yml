# Application configuration example
server:
  host: 127.0.0.1
  port: 8080
  timeout_seconds: 30
  ssl:
    enabled: true
    certificate_path: "/etc/ssl/certs/app.crt"

database:
  engine: postgresql
  host: localhost
  port: 5432
  name: production_db
  pool_size: 10

logging:
  level: INFO
  destinations:
    - console
    - file:
        path: /var/log/app.log
        rotate: daily

features:
  user_registration: true
  maintenance_mode: false
  allowed_roles:
    - admin
    - editor
    - viewer